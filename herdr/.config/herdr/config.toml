# herdr configuration — mirrors ~/.tmux.conf counterparts
# Full reference: herdr --default-config

[theme]
name = "dracula"

[theme.custom]
panel_bg = "reset"

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+="
split_horizontal = "prefix+minus"

[ui]
mouse_scroll_lines = 3

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
